[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nebo"
dynamic = ["version"]
description = "A modern logging SDK for multi-modal data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    "msgpack>=1.0.0",
    "numpy>=1.23.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0"
]

[project.urls]
Homepage = "https://nebo.rsamf.com"
Documentation = "https://nebo.rsamf.com/docs"
Repository = "https://github.com/rsamf/nebo"
Issues = "https://github.com/rsamf/nebo/issues"

[project.optional-dependencies]
deploy = ["huggingface_hub>=0.20.0"]
# Robotics: MJCF/URDF -> GLB compilation for the action modality. SDK-side
# only -- the daemon and the UI never import these (tests/conftest.py's
# blocked_import guard enforces it), so a nebo server stays lightweight.
robotics = ["mujoco>=3.1", "yourdfpy>=0.0.56", "trimesh>=4.0"]

# PEP 735 dependency-groups. `uv sync --all-groups` syncs all groups
# listed here but does NOT touch [project.optional-dependencies], so the
# `deploy` extra above (which end users install via `pip install
# nebo[deploy]`) is mirrored as a dep-group here for CI workflows that
# need `nebo deploy` to work after a plain `uv sync --all-groups`.
[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.23.8",
    # Test-only: PIL decodes/authors images in tests (the package itself
    # no longer depends on it) and fastapi.testclient requires httpx.
    "pillow>=10.0.0",
    "httpx>=0.24.0",
    "sphinxcontrib-applehelp>=1.0.8",
    "sphinxcontrib-devhelp>=1.0.6",
    "sphinxcontrib-htmlhelp>=2.0.5",
    "sphinxcontrib-jquery>=4.1",
    "sphinxcontrib-jsmath>=1.0.1",
    "sphinxcontrib-qthelp>=1.0.7",
    "sphinxcontrib-serializinghtml>=1.1.10",
    "sphinx-sitemap>=2.6.0",
    "sphinxawesome-theme>=5.2.0",
    "sphinx-design>=0.6.1",
    "selenium>=4.28.1",
    "webdriver-manager>=4.0.2",
]
deploy = ["huggingface_hub>=0.20.0"]
robotics = ["mujoco>=3.1", "yourdfpy>=0.0.56", "trimesh>=4.0"]

[project.scripts]
nebo = "nebo.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = ["nebo/server/static/.gitkeep"]
# Force-include even when gitignored. The static bundle is untracked
# (generated by `npm run build` + cp into nebo/server/static/) but must
# ship in the wheel so `nebo deploy` / `nebo serve` can serve the UI.
artifacts = [
    "nebo/server/spaces/**",
    "nebo/server/static/**",
]

# Note: do NOT add a [tool.hatch.build.targets.wheel.force-include] for
# nebo/skills — it is already discovered by default hatch source rules
# (tracked in git, inside the package). Force-including it on top would
# emit each SKILL.md twice in the wheel ZIP, which trips PyPI's
# duplicate-local-header validator and rejects the upload with HTTP 400.
